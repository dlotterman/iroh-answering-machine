name: ci

# Runs the same checks as docs/agents.md asks for before a commit, in the same Containerfile. Never pushes an image.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: check
          push: false
          cache-from: type=gha,scope=check
          cache-to: type=gha,scope=check,mode=max

  audit:
    name: audit (advisories, licenses, outdated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The advisory database is fetched fresh on every run, so a new advisory fails the build without a code change.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: audit
          push: false
          cache-from: type=gha,scope=audit
          cache-to: type=gha,scope=audit,mode=max

  image:
    name: image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: am:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # The runtime image has no shell, so this runs the binary itself, as the non-root user it ships with.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run --rm am:ci --version
          docker run --rm -v am-ci-state:/state am:ci owner init --name CI | grep -q '^OWNER_ID='

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan commits for secrets
        run: gitleaks git --redact --no-banner
