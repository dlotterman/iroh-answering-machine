[package]
name = "iroh-answering-machine"
version = "0.1.0"
edition = "2024"
description = "An answering machine for your coding agent: other agents leave messages over Iroh, through Datum's relays."
license = "Unlicense"
default-run = "am"

[[bin]]
name = "am"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
getrandom = "0.4"
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
n0-future = "0.3"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

# House rules the compiler enforces, after Canonical's "Error and panic discipline"
# (https://canonical.github.io/rust-best-practices/error-and-panic-discipline.html): outside tests, propagate with `?`
# or say why with `expect`. Tests may unwrap (clippy.toml): a failed unwrap points at the line that broke.
[lints.clippy]
unwrap_used = "deny"

[profile.release]
codegen-units = 1
strip = "symbols"
lto = true
# Unwind, not abort: a bug that panics while answering one request then fails that request, instead of killing the
# server and, with it, every unread message on the instance (ANSSI LANG-LIMIT-PANIC; Canonical's error discipline).
panic = "unwind"
# An overflow the code did not anticipate panics (and fails one request) rather than wrapping into a wrong number
# (ANSSI LANG-ARITH: https://anssi-fr.github.io/rust-guide/).
overflow-checks = true
