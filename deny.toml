# cargo-deny policy: what may be in this program's dependency tree (ANSSI LIBS-VETTING, LIBS-AUDIT).
# Run with `podman build --target audit .`. Every exception below says why.

[graph]
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]

[advisories]
# Any vulnerability fails the build; unmaintained crates are reported for our whole tree.
unmaintained = "all"
ignore = [
  # `paste` is unmaintained. It is a compile-time macro (nothing of it runs) and arrives through iroh's netwatch; only
  # iroh can drop it. Recheck when iroh is upgraded.
  { id = "RUSTSEC-2024-0436", reason = "build-time macro via iroh/netwatch; no runtime code; only iroh can replace it" },
]

[licenses]
# Permissive licenses only: the image is published under The Unlicense, and nothing here may add obligations beyond
# keeping notices. Filled in from `cargo deny list`.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-roots: Mozilla's CA list as data
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are a fact of life with iroh's tree; report them, don't fail on them.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
